<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adelya & Ben — Bir Yıldız Kayması Kadar Ani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #F3EEE4;
    --ink-dim: #C9C6D8;
    --night: #14142B;
    --night-deep: #0C0C1F;
    --panel: #1F1F42;
    --gold: #D8B978;
    --gold-soft: rgba(216,185,120,0.35);
    --rose: #E3AAB3;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    height:100%;
    background: var(--night-deep);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    overflow-x: hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    position:relative;
  }

  /* ---------- Night sky ---------- */
  #sky{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse 120% 70% at 50% -15%, #24244f 0%, #171736 40%, var(--night-deep) 78%),
      var(--night-deep);
    overflow:hidden;
  }

  #sky-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  /* ---------- Layout ---------- */
  main{
    position:relative;
    z-index:1;
    width:100%;
    max-width:760px;
    padding: 6vh 24px 8vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .eyebrow{
    font-size:0.78rem;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color: var(--gold);
    margin-bottom: 28px;
    opacity:0.85;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: clamp(2.4rem, 6vw, 4.2rem);
    line-height:1.05;
    letter-spacing:0.01em;
  }

  h1 em{
    font-style:italic;
    font-weight:500;
    color: var(--rose);
  }

  .date-line{
    margin-top:18px;
    font-size:0.95rem;
    color: var(--ink-dim);
    letter-spacing:0.04em;
  }

  /* ---------- Signature: constellation ---------- */
  .constellation{
    position:relative;
    width:100%;
    max-width:520px;
    height:150px;
    margin: 54px 0 30px;
  }

  .node{
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    background: var(--gold);
    box-shadow: 0 0 18px 4px var(--gold-soft);
  }

  .node.left{ left: 6%; top: 60%; }
  .node.right{ right: 6%; top: 30%; }

  .node-label{
    position:absolute;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.05rem;
    color: var(--ink-dim);
    white-space:nowrap;
  }

  .node.left .node-label{ top: 22px; left:-8px; }
  .node.right .node-label{ top: -32px; right:-4px; }

  svg.line{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
  }

  .link-path{
    fill:none;
    stroke: var(--gold);
    stroke-width:1.4;
    stroke-dasharray: 6 8;
    opacity:0.75;
  }

  .heart{
    position:absolute;
    left:50%;
    top:44%;
    transform: translate(-50%,-50%);
    font-size:1.1rem;
    color: var(--rose);
  }

  /* ---------- Counter ---------- */
  .counter{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    width:100%;
    max-width:560px;
    margin-top: 8px;
  }

  .unit{
    background: var(--panel);
    border: 1px solid rgba(216,185,120,0.18);
    border-radius:10px;
    padding: 18px 8px 14px;
  }

  .unit .num{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .unit .label{
    margin-top:6px;
    font-size:0.68rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color: var(--ink-dim);
  }

  .message{
    margin-top: 44px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size: clamp(1.05rem, 2.4vw, 1.35rem);
    color: var(--ink-dim);
    max-width:480px;
    line-height:1.6;
  }

  footer{
    position:relative;
    z-index:1;
    padding: 20px 24px 40px;
    font-size:0.72rem;
    letter-spacing:0.08em;
    color: rgba(201,198,216,0.45);
    text-align:center;
  }

  @media (max-width: 480px){
    .counter{ gap:8px; }
    .unit{ padding:14px 4px 10px; }
    .constellation{ height:130px; }
  }

  @media (prefers-reduced-motion: reduce){
    .constellation, .heart{ animation:none !important; }
  }
</style>
</head>
<body>

<div id="sky"><canvas id="sky-canvas"></canvas></div>

<main>
  <div class="eyebrow">Bir Başlangıç Anı</div>

  <h1>Adelya ile <em>tanıştığımızdan</em><br>beri geçen zaman</h1>

  <div class="constellation">
    <svg class="line" viewBox="0 0 520 150" preserveAspectRatio="none">
      <path class="link-path" d="M 40 92 Q 260 10 480 46" />
    </svg>
    <div class="node left"><span class="node-label">Ben</span></div>
    <div class="node right"><span class="node-label">Adelya</span></div>
    <div class="heart">♥</div>
  </div>

  <div class="counter">
    <div class="unit"><div class="num" id="days">0</div><div class="label">Gün</div></div>
    <div class="unit"><div class="num" id="hours">0</div><div class="label">Saat</div></div>
    <div class="unit"><div class="num" id="minutes">0</div><div class="label">Dakika</div></div>
    <div class="unit"><div class="num" id="seconds">0</div><div class="label">Saniye</div></div>
  </div>

  <p class="message" id="message">Her saniye, o akşamdan bu yana biriken küçük bir hikâye.</p>
</main>

<footer>Adelya &amp; Ben — 22.07.2026'dan bu yana</footer>

<script>
  // Tanışma tarihi ve saati
  const meetDate = new Date(2026, 6, 22, 22, 30, 0); // Ay 0-index: 6 = Temmuz

  const daysEl = document.getElementById('days');
  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const messageEl = document.getElementById('message');

  function pad(n){ return n.toString().padStart(2, '0'); }

  function update(){
    const now = new Date();
    let diff = now - meetDate; // ms

    if(diff < 0){
      // Henüz tanışma anına ulaşılmadıysa (saat farkı vs.) geri sayım göster
      diff = Math.abs(diff);
      messageEl.textContent = "O ana çok az kaldı...";
    } else {
      messageEl.textContent = "Her saniye, o akşamdan bu yana biriken küçük bir hikâye.";
    }

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    daysEl.textContent = days;
    hoursEl.textContent = pad(hours);
    minutesEl.textContent = pad(minutes);
    secondsEl.textContent = pad(seconds);
  }

  update();
  setInterval(update, 1000);

  // ---------- Gece göğü: gerçekçi yıldız alanı ----------
  (function(){
    const canvas = document.getElementById('sky-canvas');
    const ctx = canvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let W, H, dpr;
    let stars = [];
    let shootingStars = [];
    let milkyWayAngle;
    let milkyDust = [];
    let nebulae = [];
    let parallaxX = 0, parallaxY = 0;
    let targetParallaxX = 0, targetParallaxY = 0;

    // Yıldız renk sıcaklıkları: çoğu beyaz, bir kısmı hafif mavi/sarı/kızıl
    const tints = [
      '255,255,255',   // beyaz
      '255,255,255',
      '255,255,255',
      '210,225,255',   // mavimsi
      '255,244,214',   // sarımsı
      '255,224,196'    // kızılımsı (dev yıldız)
    ];

    function rand(min, max){ return Math.random() * (max - min) + min; }

    function resize(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      milkyWayAngle = -0.35; // hafif eğik band
      buildStars();
      buildMilkyDust();
      buildNebulae();
    }

    function buildMilkyDust(){
      milkyDust = [];
      const count = Math.floor(W / 22);
      for(let i = 0; i < count; i++){
        milkyDust.push({
          x: rand(-W, W),
          y: rand(-H * 0.14, H * 0.14),
          r: rand(30, 90),
          a: rand(0.015, 0.05)
        });
      }
    }

    function buildNebulae(){
      // Az sayıda, çok soluk renkli bulut lekesi — gerçek uzun pozlamalı fotoğraflardaki gibi
      const palette = ['120,90,150', '80,110,150', '150,95,110'];
      nebulae = [];
      const count = window.innerWidth < 600 ? 2 : 3;
      for(let i = 0; i < count; i++){
        nebulae.push({
          x: rand(W * 0.1, W * 0.9),
          y: rand(H * 0.1, H * 0.6),
          r: rand(Math.min(W,H) * 0.18, Math.min(W,H) * 0.32),
          a: rand(0.025, 0.05),
          color: palette[i % palette.length]
        });
      }
    }

    function buildStars(){
      const density = (W * H) / 9000;
      const count = Math.min(Math.floor(density), window.innerWidth < 600 ? 220 : 420);
      stars = [];
      for(let i = 0; i < count; i++){
        // Samanyolu bandına yakın yıldızları biraz yoğunlaştır
        const nearBand = Math.random() < 0.35;
        let x = rand(0, W);
        let y = rand(0, H);
        if(nearBand){
          const t = rand(0, 1);
          const bandX = t * W;
          const bandY = H * 0.5 + (bandX - W/2) * Math.tan(milkyWayAngle) + rand(-90, 90);
          x = bandX; y = bandY;
        }
        const layer = Math.random(); // derinlik: 0 uzak/küçük, 1 yakın/büyük
        const size = layer < 0.7 ? rand(0.4, 1.2) : rand(1.2, 2.2);
        stars.push({
          x, y, size,
          tint: tints[Math.floor(Math.random() * tints.length)],
          baseAlpha: rand(0.25, 0.95),
          phase: rand(0, Math.PI * 2),
          speed: rand(0.4, 1.4) * (reduceMotion ? 0 : 1),
          spike: size > 1.6 && Math.random() < 0.5 // parlak yıldızlara ince ışın ekle
        });
      }
    }

    function maybeSpawnShootingStar(){
      if(reduceMotion) return;
      if(Math.random() < 0.0035 && shootingStars.length < 2){
        const startX = rand(W * 0.1, W * 0.7);
        const startY = rand(0, H * 0.35);
        const angle = rand(0.35, 0.55); // aşağı-sağa doğru
        shootingStars.push({
          x: startX, y: startY,
          vx: Math.cos(angle) * rand(9, 13),
          vy: Math.sin(angle) * rand(9, 13),
          life: 0,
          maxLife: rand(40, 65)
        });
      }
    }

    function drawMoon(){
      const mx = W * 0.86;
      const my = H * 0.16;
      const r = Math.max(22, Math.min(W, H) * 0.045);

      // Ay halesi
      const glow = ctx.createRadialGradient(mx, my, 0, mx, my, r * 5);
      glow.addColorStop(0, 'rgba(243,238,228,0.16)');
      glow.addColorStop(1, 'rgba(243,238,228,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(mx, my, r * 5, 0, Math.PI * 2);
      ctx.fill();

      // Ay gövdesi
      ctx.save();
      ctx.beginPath();
      ctx.arc(mx, my, r, 0, Math.PI * 2);
      ctx.fillStyle = '#F3EEE4';
      ctx.fill();

      // Hilal gölgesi (ayın bir kısmını karart)
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(mx + r * 0.55, my - r * 0.25, r * 0.92, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Kraterler (çok hafif)
      ctx.fillStyle = 'rgba(180,172,150,0.25)';
      [[-0.25,-0.15,0.16],[0.05,0.25,0.11],[-0.35,0.2,0.09]].forEach(([dx,dy,rr])=>{
        ctx.beginPath();
        ctx.arc(mx + dx*r, my + dy*r, rr*r, 0, Math.PI*2);
        ctx.fill();
      });
    }

    function drawMilkyWay(){
      ctx.save();
      const grad = ctx.createLinearGradient(0, H * 0.15, W, H * 0.85);
      grad.addColorStop(0, 'rgba(120,110,160,0)');
      grad.addColorStop(0.5, 'rgba(150,140,190,0.07)');
      grad.addColorStop(1, 'rgba(120,110,160,0)');
      ctx.fillStyle = grad;
      ctx.translate(W/2, H/2);
      ctx.rotate(milkyWayAngle);
      ctx.fillRect(-W, -H * 0.16, W * 2, H * 0.32);

      // Bant içinde ince toz/ışık lekeleri (gerçek samanyolu fotoğraflarındaki pürüzlü doku)
      ctx.globalCompositeOperation = 'lighter';
      for(const p of milkyDust){
        const g = ctx.createRadialGradient(p.x, 0, 0, p.x, 0, p.r);
        g.addColorStop(0, `rgba(190,180,220,${p.a})`);
        g.addColorStop(1, 'rgba(190,180,220,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawNebulae(){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for(const n of nebulae){
        const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
        g.addColorStop(0, `rgba(${n.color},${n.a})`);
        g.addColorStop(1, `rgba(${n.color},0)`);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawHorizonHaze(){
      const grad = ctx.createLinearGradient(0, H * 0.7, 0, H);
      grad.addColorStop(0, 'rgba(20,20,43,0)');
      grad.addColorStop(1, 'rgba(28,26,58,0.55)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, H * 0.7, W, H * 0.3);
    }

    let t = 0;
    function frame(){
      t += 0.016;
      ctx.clearRect(0, 0, W, H);

      // Fare/dokunuşla çok hafif paralaks (derinlik hissi)
      parallaxX += (targetParallaxX - parallaxX) * 0.03;
      parallaxY += (targetParallaxY - parallaxY) * 0.03;

      drawNebulae();

      ctx.save();
      ctx.translate(parallaxX * 0.4, parallaxY * 0.4);
      drawMilkyWay();
      ctx.restore();

      drawMoon();

      ctx.save();
      ctx.translate(parallaxX, parallaxY);
      for(const s of stars){
        // Küçük/uzak yıldızlar atmosferik parıldamadan daha çok etkilenir
        const scintillation = 0.15 + (2.4 - s.size) * 0.18;
        const twinkle = reduceMotion ? 0 : Math.sin(t * s.speed + s.phase) * scintillation;
        const alpha = Math.max(0, Math.min(1, s.baseAlpha + twinkle));
        ctx.beginPath();
        ctx.fillStyle = `rgba(${s.tint},${alpha})`;
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();

        if(s.spike){
          ctx.strokeStyle = `rgba(${s.tint},${alpha * 0.5})`;
          ctx.lineWidth = 0.6;
          const L = s.size * 3.2;
          ctx.beginPath();
          ctx.moveTo(s.x - L, s.y); ctx.lineTo(s.x + L, s.y);
          ctx.moveTo(s.x, s.y - L); ctx.lineTo(s.x, s.y + L);
          ctx.stroke();
        }
      }
      ctx.restore();

      drawHorizonHaze();

      maybeSpawnShootingStar();
      for(let i = shootingStars.length - 1; i >= 0; i--){
        const sh = shootingStars[i];
        sh.x += sh.vx; sh.y += sh.vy; sh.life++;
        const progress = sh.life / sh.maxLife;
        const alpha = Math.sin(progress * Math.PI);
        const tailX = sh.x - sh.vx * 5;
        const tailY = sh.y - sh.vy * 5;
        const g = ctx.createLinearGradient(sh.x, sh.y, tailX, tailY);
        g.addColorStop(0, `rgba(255,255,255,${alpha})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = g;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(sh.x, sh.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();
        if(sh.life >= sh.maxLife) shootingStars.splice(i, 1);
      }

      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);

    if(!reduceMotion){
      window.addEventListener('mousemove', (e) => {
        targetParallaxX = (e.clientX / window.innerWidth - 0.5) * 18;
        targetParallaxY = (e.clientY / window.innerHeight - 0.5) * 12;
      });
      window.addEventListener('deviceorientation', (e) => {
        if(e.gamma == null) return;
        targetParallaxX = Math.max(-1, Math.min(1, e.gamma / 30)) * 14;
        targetParallaxY = Math.max(-1, Math.min(1, (e.beta - 45) / 30)) * 10;
      });
    }

    resize();
    frame();
  })();
</script>

</body>
</html>
